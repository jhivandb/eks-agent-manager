apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

# Separate from cluster.yaml because eksctl refuses a cluster-create config
# that contains managedNodeGroups when disableDefaultAddons is set. Applied
# with `eksctl create nodegroup -f` after Cilium is installed.

metadata:
  name: amp-test
  region: us-east-1
  version: "1.34"
  tags:
    project: agent-manager-eval
    owner: jhivan@wso2.com

managedNodeGroups:
  - name: ng-default
    amiFamily: AmazonLinux2023
    # 8 vCPU / 16 GiB. The 4-vCPU m8i-flex.xlarge this replaced held the same
    # 16 GiB but left the platform CPU-bound; a managed nodegroup's instanceType
    # is immutable, so the change arrives as a new nodegroup.
    instanceType: c8i-flex.2xlarge
    desiredCapacity: 3
    minSize: 3
    maxSize: 5
    volumeSize: 50
    volumeType: gp3
    volumeEncrypted: true
    privateNetworking: true
    # AL2023 nodeadm derives max-pods from the vpc-cni formula, which does not
    # apply here. Cilium runs ENI IPAM with native routing, so every pod holds a
    # real VPC address and this ceiling is a hard one — overcommitting strands
    # pods Unschedulable with nothing naming the cause.
    #
    # c8i-flex.2xlarge reports 4 network interfaces at 30 IPv4 each. One address
    # per ENI is the interface's own, leaving 4 x 29 = 116 assignable to pods, so
    # 110 keeps headroom. Same budget as the m8i-flex.xlarge this replaced — the
    # extra vCPU does not buy more addresses, so the pod ceiling did not move.
    # Re-derive with `aws ec2 describe-instance-types --instance-types <type>
    # --query 'InstanceTypes[].NetworkInfo'` before changing instanceType.
    maxPodsPerNode: 110
    # Keeps every other pod off a node until cilium-agent is ready on it.
    taints:
      - key: node.cilium.io/agent-not-ready
        value: "true"
        effect: NoExecute
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      # cilium-operator uses the node instance profile to manage ENIs.
      # AmazonEKS_CNI_Policy covers everything it needs except these two reads.
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeVpcs
              - ec2:DescribeSecurityGroups
            Resource: "*"
