apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: amp-test
  region: us-east-1
  version: "1.34"
  tags:
    project: agent-manager-eval
    owner: jhivan@wso2.com

# Cilium provides both the CNI and the service proxy, so no AWS default addon
# (vpc-cni, kube-proxy, coredns, metrics-server) is installed automatically.
# coredns/metrics-server/ebs-csi come back explicitly via addons.yaml.
addonsConfig:
  disableDefaultAddons: true
  autoApplyPodIdentityAssociations: true

# eksctl picks AZs at random, and the flex instance families are not offered in
# every us-east-1 zone: c8i-flex.2xlarge is offered in 1a/1b/1c/1d/1f but not in
# 1e, the same gap m8i-flex had. Pinned to three of the zones that do offer it.
# Re-check with `aws ec2 describe-instance-type-offerings --location-type
# availability-zone --filters Name=instance-type,Values=<type>` before changing
# the nodegroup's instanceType.
availabilityZones:
  - us-east-1a
  - us-east-1b
  - us-east-1c

vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

iam:
  withOIDC: true

# The nodegroup lives in nodegroup.yaml: with disableDefaultAddons (no VPC
# CNI), eksctl refuses to create a cluster from any config that so much as
# contains managedNodeGroups — even with --without-nodegroup.
