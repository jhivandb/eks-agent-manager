apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: amp-test
  region: us-east-1

addonsConfig:
  disableDefaultAddons: true
  autoApplyPodIdentityAssociations: true

# Applied only after Cilium is up and nodes are Ready — each of these needs a
# schedulable node, and eks-pod-identity-agent must exist before eksctl can
# attach the EBS CSI driver's pod identity association.
addons:
  - name: eks-pod-identity-agent
    version: latest
  - name: coredns
    version: latest
  - name: metrics-server
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
