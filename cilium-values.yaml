# Cilium on EKS: ENI IPAM with native routing, replacing kube-proxy.
# k8sServiceHost is passed via --set at install time (read from the cluster).

ipam:
  mode: eni

eni:
  enabled: true
  # Without this, Cilium may attach pod ENIs to a public subnet in the node's
  # AZ, where pods get no public IP and no route to the NAT gateway.
  # eksctl tags its private subnets with kubernetes.io/role/internal-elb=1.
  subnetTagsFilter:
    - kubernetes.io/role/internal-elb=1

routingMode: native

# AL2023 on Nitro names the primary interface enX0; eth+ is kept for safety.
egressMasqueradeInterfaces: eth+,enX+

kubeProxyReplacement: true
k8sServicePort: 443

operator:
  replicas: 2

# OpenChoreo installs Gateway API CRDs and runs kgateway/Envoy as the gateway
# implementation. Cilium must not claim Gateway API resources.
gatewayAPI:
  enabled: false

# Left off to conserve headroom on a 3 x 8vCPU/16GiB cluster. Enable if you need
# flow visibility while debugging the platform install.
hubble:
  enabled: false
